candidate:
  name: Danylo Shylkov
  experience_years: 2.5          # Huawei Polska с 05.2024
  current_title: Infrastructure Support Engineer — Enterprise Storage & Telecom Platforms
  languages: [english, polish, ukrainian, russian]

# Поисковые запросы для Adzuna (источник не отдаёт всё подряд, нужны запросы)
search:
  adzuna_queries:
    - "storage engineer"
    - "linux administrator"
    - "system administrator"
    - "infrastructure engineer"
    - "noc engineer"
    - "technical support engineer"
    - "administrator systemów"
    - "data center engineer"
  adzuna_pages: 1

# Чем выше вес, тем выше вакансия в топе
target_roles:
  - {weight: 10, patterns: ["storage engineer", "storage administrator", "san engineer", "storage specialist", "backup engineer", "administrator macierzy", "inżynier storage"]}
  - {weight: 9,  patterns: ["linux administrator", "linux system administrator", "linux engineer", "system administrator", "systems engineer", "administrator systemów", "administrator linux"]}
  - {weight: 8,  patterns: ["infrastructure engineer", "infrastructure specialist", "data center engineer", "datacenter", "virtualization engineer", "vmware"]}
  - {weight: 7,  patterns: ["noc engineer", "l2 support", "second line", "2nd line", "technical support engineer", "application support", "production support", "telecom", "oss/bss", "charging"]}
  - {weight: 5,  patterns: ["cloud support", "cloud engineer", "junior devops", "devops engineer", "site reliability", "platform engineer"]}

skills:
  strong:     # то, что есть в CV и в работе (+3 за каждое совпадение, максимум +15)
    [san, nas, "fibre channel", " fc ", iscsi, nvme, raid, lun, storage, huawei, oceanstor, netapp, "dell emc", "pure storage", hitachi, "ibm svc", brocade,
     linux, ubuntu, suse, rhel, bash, systemd, ntp, virtualization, fusioncompute, hyper-v,
     docker, ansible, "github actions", git, prometheus, grafana, nginx, python,
     tcp/ip, dns, vlan, vpn, firewall, wireshark,
     itil, itsm, incident, "change management", "on-call", maintenance, upgrade, cve, patching]
  learning:   # уже изучаю, не должно отсеивать (+1)
    [kubernetes, terraform, postgresql, kafka, zabbix, aws, azure, gcp, vmware, veeam, commvault]
  gaps:       # если это ГЛАВНОЕ требование, ставь штраф -5, но не отсеивай
    [java, ".net", "react", "frontend", "machine learning", "sap abap", "salesforce"]

seniority:
  ok: [junior, regular, mid, "mid/senior", specialist]
  penalty: [senior, lead, principal, architect, head, manager]   # -8
  max_years_required: 4        # «5+ years» → -6

exclude_titles:   # такие вакансии не показывать вообще
  [developer, programista, frontend, backend developer, "data scientist", "data analyst",
   sales, "account manager", recruiter, "1st line", helpdesk, "service desk", "call center", intern, praktyk]

salary:   # в PLN за месяц
  min_uop_gross: 13000
  min_b2b_net: 16000           # B2B без оплачиваемого отпуска + ZUS, поэтому выше
  # Сравнивай с ВЕРХНЕЙ границей вилки: если верх вилки < минимума → вакансию не показывать.
  # Если вилка перекрывает минимум (напр. 11–15k) → показывать без штрафа.
  # Вилка в EUR/USD → переводи в PLN; почасовая ставка × 168 = месяц.
  below_min: exclude
  no_salary_listed: 0          # без вилки — показывать, не штрафовать (в Польше ~половина вакансий без вилки)
  above_target_bonus: {from_uop_gross: 15000, from_b2b_net: 18000, points: 4}

location:
  home: warszawa
  accept: [warszawa, warsaw, remote, zdalnie, "fully remote", "praca zdalna", hybrid, hybrydowo]
  far_onsite_penalty: -10      # стационарно в другом городе

bonus:
  - {pattern: "ukrainian|ukraiński|russian|rosyjski", points: 5, why: "редкий язык — твоё преимущество"}
  - {pattern: "huawei|oceanstor|telecom|operator", points: 4, why: "прямой опыт"}
  - {pattern: "bank|banking|finance", points: 2, why: "банки много нанимают storage/linux"}

# Настройки бота (не часть профиля кандидата)
bot:
  weekly_applied_goal: 10
  push_min_score: 25
  collect_every_hours: 3
  followup_days: 7
  eur_pln: 4.30
  usd_pln: 3.90
